<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8f1ee"><title>Life OS – Gentle Bloom</title>
<style>
:root{--bg:#fbf7f1;--paper:#fffefa;--ink:#48413f;--muted:#897f7a;--line:#eee3dd;--pink:#f3d9df;--pink2:#e9b9c8;--sage:#dce8dc;--sage2:#9eb8a0;--lav:#e9e0f4;--peach:#f8e4d5;--shadow:0 8px 28px #806a5e12}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{border:0;border-radius:12px;padding:10px 14px;background:var(--pink2);color:#49383d;cursor:pointer;font-weight:650}button:hover{filter:brightness(.98)}button.secondary{background:var(--sage)}button.soft{background:var(--lav)}button.ghost{background:transparent;border:1px solid var(--line)}button.danger{background:#f5e1df;color:#8a4c4b}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px 11px;background:#fff;color:var(--ink);min-width:0}label{display:grid;gap:5px;font-size:13px;color:var(--muted)}textarea{resize:vertical}.app{display:grid;grid-template-columns:245px minmax(0,1fr);min-height:100vh}.side{background:#fffaf7;border-right:1px solid var(--line);padding:22px 15px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-size:22px;font-weight:850;letter-spacing:1px}.brand span{color:#c77991}.sub{font-size:12px;color:var(--muted)}.nav{display:grid;gap:5px;margin-top:24px}.nav button{background:transparent;text-align:left;color:var(--ink);font-weight:550}.nav button.active,.nav button:hover{background:var(--pink)}main{max-width:1450px;width:100%;padding:26px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:20px}.eyebrow{font-size:12px;letter-spacing:1px;color:var(--muted)}h1{font-size:28px;margin:3px 0}h2{font-size:17px;margin:0 0 13px}h3{font-size:15px;margin:12px 0 8px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow);min-width:0}.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}.metric{font-size:28px;font-weight:800}.list{display:grid;gap:9px}.item{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:13px;padding:10px;min-width:0}.grow{flex:1;min-width:0;overflow-wrap:anywhere}.item small{display:block;color:var(--muted)}.pill{display:inline-block;border-radius:99px;padding:3px 8px;background:var(--sage);font-size:11px;white-space:nowrap}.pill.pink{background:var(--pink)}.pill.lav{background:var(--lav)}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}.full{grid-column:1/-1}.empty,.note{padding:13px;border-radius:13px;background:#fbf4ef;color:var(--muted);font-size:13px}.progress{height:7px;background:#f0e8e2;border-radius:99px;overflow:hidden;margin-top:7px}.progress i{display:block;height:100%;background:var(--sage2)}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.tabs button{background:white;border:1px solid var(--line);font-weight:500}.tabs button.active{background:var(--sage)}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.day{min-height:75px;border:1px solid var(--line);border-radius:10px;padding:5px;background:#fff;font-size:12px;cursor:pointer;overflow:hidden}.day.today{border:2px solid var(--pink2)}.day.selected{background:#fae9ed}.day .dot{display:block;font-size:10px;color:#9b6677;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{color:var(--muted);font-weight:600}.check{width:18px;height:18px;accent-color:#a0b9a2}.bar{height:10px;border-radius:99px;background:#eee5df;overflow:hidden}.bar i{display:block;height:100%;background:#a8c4ac}.bottom{display:none}.section-head{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.tiny{font-size:12px}.tagline{background:linear-gradient(100deg,#f8e5e8,#f2eee8,#e8f0e5);border-radius:16px;padding:15px;margin-bottom:14px}@media(max-width:950px){.app{display:block}.side{display:none}main{padding:18px 13px 88px}.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:10;background:#fffaf8;border-top:1px solid var(--line);padding:6px;gap:3px;overflow-x:auto}.bottom button{background:transparent;min-width:68px;padding:8px 6px;font-size:11px;white-space:nowrap}.bottom button.active{background:var(--pink)}.s3,.s4,.s5,.s6,.s7,.s8{grid-column:span 12}.top{align-items:flex-start}h1{font-size:24px}.form{grid-template-columns:1fr}.full{grid-column:auto}.day{min-height:58px;padding:3px;font-size:11px}.calendar{gap:3px}.card{padding:14px}}
</style></head><body><div class="app"><aside class="side"><div class="brand">🌷 LIFE OS <span>♡</span></div><div class="sub">GENTLE BLOOM · PERSONAL LIFE SYSTEM</div><div id="sideNav" class="nav"></div><div class="note" style="margin-top:20px">ชีวิตที่ดีไม่ต้องสมบูรณ์แบบ ค่อย ๆ เติบโตในแบบของเรา 🌱</div><div class="sub" style="margin-top:12px" id="storageNote">บันทึกในเบราว์เซอร์นี้</div></aside><main><div class="top"><div><div id="today" class="eyebrow"></div><h1 id="title">ภาพรวมชีวิต</h1><div id="subtitle" class="muted">ค่อย ๆ จัดการทีละเรื่องก็เก่งมากแล้ว</div></div><button id="quickAdd">＋ เพิ่มงาน</button></div><div id="content"></div></main></div><div class="bottom" id="bottomNav"></div>
<script>
const P=[['home','🏡','ภาพรวม'],['planner','🗓️','Planner'],['goals','🌱','เป้าหมาย'],['study','📚','การเรียน'],['habits','🌷','นิสัย'],['finance','💰','การเงิน'],['health','🫧','สุขภาพ'],['documents','📁','เอกสาร'],['journal','📝','Journal'],['review','✨','รีวิวชีวิต'],['settings','⚙️','ตั้งค่า']];
const KEY='gentle-bloom-v3';const blank=()=>({tasks:[],projects:[],goals:[],vocab:[],habits:[],transactions:[],accounts:[],debts:[],bills:[],savings:[],health:[],medications:[],appointments:[],documents:[],journals:[],reviews:[],sync:{}});let state;try{state=JSON.parse(localStorage.getItem(KEY)||'null')}catch{}if(!state){try{state=JSON.parse(localStorage.getItem('lifeos-elegant-v1')||'null')}catch{}}state={...blank(),...(state||{})};for(const k of Object.keys(blank()))if(!state[k])state[k]=blank()[k];let page='home',calDate=new Date(),selectedDate=localDate(new Date());
function localDate(d){let x=new Date(d.getTime()-d.getTimezoneOffset()*60000);return x.toISOString().slice(0,10)}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(v){return (Number(v)||0).toLocaleString('th-TH',{maximumFractionDigits:2})+' ฿'}function save(){localStorage.setItem(KEY,JSON.stringify(state));document.getElementById('storageNote').textContent='บันทึกล่าสุด '+new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})}
const today=localDate(new Date());document.getElementById('today').textContent=new Date().toLocaleDateString('th-TH',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
function nav(){for(let id of ['sideNav','bottomNav'])document.getElementById(id).innerHTML=P.map(p=>`<button data-page="${p[0]}" class="${page===p[0]?'active':''}">${p[1]} ${p[2]}</button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()})}function card(t,b,s='s6'){return `<section class="card ${s}"><h2>${t}</h2>${b}</section>`}function field(label,name,type='text',placeholder='',required=false){return `<label>${label}<input name="${name}" type="${type}" placeholder="${placeholder}" ${required?'required':''}></label>`}function select(label,name,opts){return `<label>${label}<select name="${name}">${opts.map(o=>Array.isArray(o)?`<option value="${esc(o[0])}">${esc(o[1])}</option>`:`<option>${esc(o)}</option>`).join('')}</select></label>`}function area(label,name,rows=2){return `<label class="full">${label}<textarea name="${name}" rows="${rows}"></textarea></label>`}function form(type,fields){return `<form class="form" data-form="${type}">${fields}<div class="full"><button>บันทึกข้อมูล ♡</button></div></form>`}function empty(t='ยังไม่มีข้อมูล ลองเพิ่มรายการแรกดูนะ 🌷'){return `<div class="empty">${t}</div>`}function del(k,i){return `<button class="danger tiny" data-delete="${k}:${i}">ลบ</button>`}function item(title,sub='',right='',remove=''){return `<div class="item"><div class="grow"><b>${esc(title)}</b><small>${esc(sub)}</small></div>${right}${remove}</div>`}
function taskItems(tasks=state.tasks){if(!tasks.length)return empty('ยังไม่มีงานในรายการนี้');return `<div class="list">${tasks.map(t=>{let i=state.tasks.indexOf(t);return `<div class="item"><input class="check" type="checkbox" data-taskdone="${i}" ${t.status==='Done'||t.done?'checked':''}><div class="grow"><b style="${t.status==='Done'||t.done?'text-decoration:line-through;opacity:.55':''}">${esc(t.title)}</b><small>${esc(t.date||'ไม่กำหนดวัน')} ${t.time?'· '+esc(t.time):''} · ${esc(t.status|| (t.done?'Done':'To do'))} · ${esc(t.priority||'Normal')}</small></div>${t.project?`<span class="pill">${esc(projectName(t.project))}</span>`:''}${del('tasks',i)}</div>`}).join('')}</div>`}function projectName(id){return state.projects.find(p=>p.id===id)?.name||'ไม่มีโปรเจกต์'}function tasksDue(date){return state.tasks.filter(t=>t.date===date)}
function calendar(){let y=calDate.getFullYear(),m=calDate.getMonth(),first=new Date(y,m,1),offset=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate(),cells='';for(let i=0;i<offset;i++)cells+='<div></div>';for(let d=1;d<=days;d++){let date=localDate(new Date(y,m,d)),ts=tasksDue(date),extras=[...state.bills.filter(x=>x.due===date).map(x=>'💳 '+x.name),...state.documents.filter(x=>x.expiry===date).map(x=>'📁 '+x.name),...state.appointments.filter(x=>x.date===date).map(x=>'🩺 '+x.title)];cells+=`<div class="day ${date===today?'today':''} ${date===selectedDate?'selected':''}" data-date="${date}"><b>${d}</b>${ts.slice(0,2).map(t=>`<span class="dot">${t.status==='Done'?'✓ ':''}${esc(t.title)}</span>`).join('')}${extras.slice(0,1).map(x=>`<span class="dot">${esc(x)}</span>`).join('')}</div>`}return `<div class="section-head"><button class="ghost" id="prevMonth">‹ ก่อนหน้า</button><b>${calDate.toLocaleDateString('th-TH',{month:'long',year:'numeric'})}</b><button class="ghost" id="nextMonth">ถัดไป ›</button></div><div class="calendar">${['จ.','อ.','พ.','พฤ.','ศ.','ส.','อา.'].map(x=>`<div class="muted tiny" style="text-align:center">${x}</div>`).join('')}${cells}</div><div style="margin-top:14px"><b>กำหนดการวันที่ ${esc(selectedDate)}</b>${tasksDue(selectedDate).length?taskItems(tasksDue(selectedDate)):empty('ไม่มีงานในวันที่เลือก')}</div>`}
function render(){nav();document.getElementById('title').textContent=P.find(x=>x[0]===page)[2];let c='',income=state.transactions.filter(x=>x.type==='income').reduce((a,x)=>a+(+x.amount||0),0),expense=state.transactions.filter(x=>x.type==='expense'||x.type==='donation').reduce((a,x)=>a+(+x.amount||0),0),done=state.tasks.filter(t=>t.status==='Done'||t.done).length;
if(page==='home'){c=`<div class="tagline">🌷 <b>วันนี้ไม่ต้องทำทุกอย่างให้สมบูรณ์แบบ</b><br><span class="muted">เลือกสิ่งสำคัญ แล้วค่อย ๆ ทำทีละอย่างนะ</span></div><div class="grid">${card('งานที่เสร็จแล้ว',`<div class="metric">${done}<span class="muted"> / ${state.tasks.length}</span></div><div class="progress"><i style="width:${state.tasks.length?done/state.tasks.length*100:0}%"></i></div>`,'s3')}${card('เงินออมที่บันทึก',`<div class="metric">${money(state.savings.reduce((a,x)=>a+(+x.current||0),0))}</div><small class="muted">ยอดออมปัจจุบันรวม</small>`,'s3')}${card('ดื่มน้ำวันนี้',`<div class="metric">${state.health.filter(x=>x.date===today&&x.kind==='water').reduce((a,x)=>a+(+x.amount||0),0)} <small>ml</small></div><button class="secondary" data-water="250">＋ 250 ml</button>`,'s3')}${card('นอนล่าสุด',`<div class="metric">${esc(state.health.filter(x=>x.kind==='sleep').slice(-1)[0]?.amount||'—')} <small>ชั่วโมง</small></div>`,'s3')}${card('ปฏิทินรวม · Master Calendar',calendar(),'s7')}${card('งานที่ต้องทำวันนี้',taskItems(tasksDue(today)),'s5')}${card('สิ่งที่ใกล้ถึงกำหนด',dueSoon(),'s6')}${card('ภาพรวมการเงิน',`<div class="row between"><span>รายรับ</span><b>${money(income)}</b></div><div class="row between"><span>รายจ่าย/บริจาค</span><b>${money(expense)}</b></div><div class="row between"><span>สุทธิที่บันทึก</span><b>${money(income-expense)}</b></div><button class="ghost" data-goto="finance">เปิดการเงิน</button>`,'s6')}</div>`}
if(page==='planner'){c=`<div class="grid">${card('เพิ่มงาน',form('task',field('ชื่องาน','title','text','เช่น อ่านหนังสือ',true)+field('วันที่','date','date')+field('เวลา','time','time')+select('สถานะ','status',['To do','In progress','Waiting','Done','Cancelled'])+select('ความสำคัญ','priority',['Normal','High','Urgent','Low'])+select('หมวด','category',['Personal','Study','Career','Health','Finance','Home'])+select('โปรเจกต์','project',[['','ไม่ผูกโปรเจกต์'],...state.projects.map(p=>[p.id,p.name])])+area('รายละเอียด','notes')),'s5')}${card('รายการงาน',taskItems(),'s7')}${card('โปรเจกต์',form('project',field('ชื่อโปรเจกต์','name','text','เช่น เรียนภาษาอังกฤษ',true)+field('วันเริ่ม','start','date')+field('วันสิ้นสุด','end','date')+select('สถานะ','status',['Planning','Active','On hold','Completed'])+field('สี (ชื่อสี)','color','text','sage / pink / lavender')+area('รายละเอียด / เป้าหมาย','description'))+ (state.projects.length?`<div class="list">${state.projects.map((p,i)=>{let linked=state.tasks.filter(t=>t.project===p.id),n=linked.filter(t=>t.status==='Done'||t.done).length,pc=linked.length?Math.round(n/linked.length*100):0;return `<div class="item"><div class="grow"><b>${esc(p.name)}</b><small>${esc(p.start||'')} – ${esc(p.end||'')} · ${esc(p.status||'Planning')} · ${linked.length} งาน</small><div class="progress"><i style="width:${pc}%"></i></div></div><span class="pill">${pc}%</span>${del('projects',i)}</div>`}).join('')}</div>`:empty()),'s12')}</div>`}
if(page==='goals'){c=`<div class="grid">${card('เพิ่มเป้าหมาย',form('goal',field('ชื่อเป้าหมาย','title','text','',true)+field('กำหนดเสร็จ','deadline','date')+field('ความคืบหน้า %','progress','number')+area('รายละเอียด','notes')),'s5')}${card('เป้าหมายของฉัน',state.goals.length?`<div class="list">${state.goals.map((g,i)=>`<div class="item"><div class="grow"><b>${esc(g.title)}</b><small>กำหนด ${esc(g.deadline||'ไม่ระบุ')}</small><div class="progress"><i style="width:${Math.max(0,Math.min(100,+g.progress||0))}%"></i></div></div><span class="pill">${+g.progress||0}%</span>${del('goals',i)}</div>`).join('')}</div>`:empty(),'s7')}</div>`}
if(page==='study'){c=`<div class="grid">${card('เพิ่มคำศัพท์',form('vocab',field('คำศัพท์','title','text','',true)+field('คำแปลไทย','meaning')+field('คำอ่าน','pronunciation')+field('หมวด','category','text','Business')+field('ทบทวนวันที่','review','date')+area('ตัวอย่างประโยค','example')),'s5')}${card('คลังคำศัพท์',state.vocab.length?`<div class="list">${state.vocab.map((v,i)=>`<div class="item"><div class="grow"><b>${esc(v.title)}</b><small>${esc(v.pronunciation||'')} · ${esc(v.meaning||'')}</small><small>${esc(v.example||'')} · ทบทวน ${esc(v.review||'—')}</small></div><button class="secondary" data-known="${i}">จำได้</button>${del('vocab',i)}</div>`).join('')}</div>`:empty(),'s7')}</div>`}

document.getElementById('content').innerHTML=c;wire();document.getElementById('quickAdd').onclick=()=>{page='planner';render();document.querySelector('input[name=title]')?.focus()};document.getElementById('prevMonth')?.addEventListener('click',()=>{calDate.setMonth(calDate.getMonth()-1);render()});document.getElementById('nextMonth')?.addEventListener('click',()=>{calDate.setMonth(calDate.getMonth()+1);render()});document.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{selectedDate=b.dataset.date;render()});document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>{page=b.dataset.goto;render()});document.getElementById('export')?.addEventListener('click',exportData);document.getElementById('importFile')?.addEventListener('change',importData);document.getElementById('saveSync')?.addEventListener('click',()=>{let raw=document.getElementById('firebaseConfig').value;try{if(raw.trim())JSON.parse(raw);state.sync={...(state.sync||{}),firebaseConfig:raw.trim()};save();document.getElementById('syncMessage').textContent='บันทึก config แล้ว แต่ยังไม่ได้เชื่อม Firebase หรือเปิดใช้ cloud sync';}catch{document.getElementById('syncMessage').textContent='รูปแบบ JSON ไม่ถูกต้อง โปรดตรวจสอบอีกครั้ง'}});document.getElementById('syncInfo')?.addEventListener('click',()=>document.getElementById('syncMessage').textContent='1) สร้าง Firebase project 2) เปิด Authentication และเลือกวิธีลงชื่อเข้าใช้ 3) สร้าง Firestore 4) ตั้ง security rules ให้ผู้ใช้แต่ละคนอ่าน/เขียนเฉพาะข้อมูลของตน 5) เพิ่มการเชื่อม Firebase SDK และทดสอบการซิงก์ก่อนใช้ข้อมูลจริง');document.getElementById('clearAll')?.addEventListener('click',()=>{if(confirm('ลบข้อมูลทั้งหมดจากเบราว์เซอร์นี้? แนะนำดาวน์โหลดไฟล์สำรองก่อน')){state=blank();save();render()}})}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='life-os-gentle-bloom-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function importData(e){let f=e.target.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x||typeof x!=='object'||Array.isArray(x))throw Error();if(confirm('นำเข้าข้อมูลนี้และแทนที่ข้อมูลปัจจุบันหรือไม่? แนะนำให้ดาวน์โหลดข้อมูลสำรองก่อน')){state={...blank(),...x};save();render();alert('นำเข้าข้อมูลเรียบร้อย')}}catch{alert('ไฟล์ไม่ถูกต้อง ไม่ได้เปลี่ยนข้อมูลเดิม')}};r.readAsText(f)}
function wire(){document.querySelectorAll('form[data-form]').forEach(f=>f.onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(f).entries()),type=f.dataset.form;d.id=d.id||crypto.randomUUID?.()||String(Date.now()+Math.random());if(type==='task'){d.status=d.status||'To do';state.tasks.push(d)}else if(type==='project')state.projects.push({...d,id:d.id,name:d.name||'โปรเจกต์ใหม่'});else if(type==='goal')state.goals.push(d);else if(type==='vocab')state.vocab.push(d);else if(type==='habit')state.habits.push({...d,target:+d.target||5});else if(type==='transaction')state.transactions.push({...d,amount:+d.amount||0});else if(type==='account')state.accounts.push({...d,balance:+d.balance||0});else if(type==='debt')state.debts.push({...d,total:+d.total||0,remaining:+d.remaining||0});else if(type==='bill')state.bills.push({...d,amount:+d.amount||0});else if(type==='saving')state.savings.push({...d,target:+d.target||0,current:+d.current||0});else if(type==='health')state.health.push({...d,amount:d.amount===''?null:+d.amount});else if(type==='medication')state.medications.push(d);else if(type==='appointment')state.appointments.push({...d,done:false});else if(type==='document')state.documents.push(d);else if(type==='journal')state.journals.push(d);else if(type==='review')state.reviews.push(d);save();render()});
document.querySelectorAll('[data-taskdone]').forEach(b=>b.onchange=()=>{let t=state.tasks[+b.dataset.taskdone];t.status=b.checked?'Done':'To do';t.done=b.checked;save();render()});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{let [k,i]=b.dataset.delete.split(':');if(confirm('ลบรายการนี้ใช่ไหม?')){state[k].splice(+i,1);save();render()}});document.querySelectorAll('[data-water]').forEach(b=>b.onclick=()=>{state.health.push({id:String(Date.now()),kind:'water',date:today,amount:+b.dataset.water,notes:'บันทึกด่วน'});save();render()});document.querySelectorAll('[data-known]').forEach(b=>b.onclick=()=>{state.vocab[+b.dataset.known].review=localDate(new Date(Date.now()+3*86400000));save();render()});document.querySelectorAll('[data-habit]').forEach(b=>b.onclick=()=>{state.habits[+b.dataset.habit].lastDone=today;save();render()});document.querySelectorAll('[data-paid]').forEach(b=>b.onclick=()=>{let x=state.bills[+b.dataset.paid];x.status=x.status==='จ่ายแล้ว'?'ยังไม่จ่าย':'จ่ายแล้ว';save();render()});document.querySelectorAll('[data-medtaken]').forEach(b=>b.onclick=()=>{let m=state.medications[+b.dataset.medtaken];(m.logs||(m.logs=[])).push(today);save();alert('บันทึกว่าทานยาแล้ววันนี้: '+m.name)});document.querySelectorAll('[data-apptdone]').forEach(b=>b.onclick=()=>{state.appointments[+b.dataset.apptdone].done=!state.appointments[+b.dataset.apptdone].done;save();render()})}
render();

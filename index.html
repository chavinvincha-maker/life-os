<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Life OS – Gentle Bloom</title><style>

ns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:5px}.field label{font-size:13px;color:var(--muted)}.field.full{grid-column:1/-1}.field textarea{min-height:75px}.kanban{display:grid;grid-template-columns:repeat(4,190px);gap:9px;overflow:auto}.kan-col{background:#fff5f5;border-radius:12px;padding:10px}.kan-task{background:white;padding:10px;border-radius:10px;margin-bottom:7px;cursor:pointer;font-size:13px}.habit-grid{display:grid;grid-template-columns:minmax(100px,1fr) repeat(7,28px);gap:6px;align-items:center}.habit-cell{width:27px;height:27px;padding:0;border-radius:8px;background:#f7eeee}.habit-cell.checked{background:var(--sage)}.notice{background:#f4f0ff;padding:13px;border-radius:12px;color:#75638f}.hidden{display:none!important}.footer{text-align:center;color:var(--muted);font-size:12px;padding:15px}.mobile-nav{display:none}.toast{position:fixed;bottom:20px;right:20px;background:#493947;color:white;padding:12px 16px;border-radius:12px;z-index:20}

</style></head><body><div class="app"><aside class="sidebar"><div class="brand"><span style="font-size:30px">🌷</span><div><strong>Life OS</strong><small>Gentle Bloom</small></div></div><nav id="sideNav"></nav><div class="side-note">🌸 ค่อย ๆ ทำทีละอย่างก็ได้<br><b>ชีวิตไม่จำเป็นต้องสมบูรณ์แบบ</b></div></aside><main class="main"><header class="topbar"><div><div class="eyebrow">YOUR GENTLE LIFE PLANNER</div><h1 id="title">สวัสดีค่ะ 🌷</h1><div class="muted" id="subtitle">จัดการชีวิตในแบบที่อ่อนโยนกับตัวเอง</div></div><div class="actions"><button class="ghost desktop-only" id="export">สำรองข้อมูล ↓</button><button class="ghost desktop-only" id="import">นำเข้าข้อมูล ↑</button><button class="primary" id="quickAdd">＋ เพิ่มงาน</button><input type="file" id="file" accept="application/json" class="hidden"></div></header><div id="page"></div><div class="footer">Life OS – Gentle Bloom · บันทึกข้อมูลในเบราว์เซอร์เครื่องนี้</div></main></div><div class="mobile-nav" id="mobileNav"></div><div id="toast" class="toast hidden"></div>
<script>
const P=[['dashboard','🏡','Dashboard'],['planner','🗓️','Planner'],['goals','🎯','Goals'],['study','📚','Study'],['habits','🌱','Habit Tracker'],['finance','💰','Finance'],['journal','📔','Journal'],['recovery','🫧','Recovery Mode'],['progress','📈','Progress & Review'],['settings','⚙️','Settings']],S=[['todo','ยังไม่เริ่ม'],['progress','กำลังทำ'],['waiting','รอติดตาม'],['done','เสร็จแล้ว'],['cancelled','ยกเลิก']],C=[['task','งาน','#f29aaa'],['appointment','นัดหมาย','#f5bd87'],['study','การเรียน','#bba8ec'],['goal','เป้าหมาย','#8dbfa4'],['habit','นิสัย','#68c4bd'],['other','อื่น ๆ','#9ebee8']],today=new Date(),iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,uid=()=>Math.random().toString(36).slice(2,10),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const seed=()=>({tasks:[{id:uid(),title:'อ่านบทเรียน Business English',projectId:'p1',status:'progress',priority:'high',date:iso(today),time:'09:00',category:'study',notes:'ทบทวนคำศัพท์'},{id:uid(),title:'สรุปบทที่ 2',projectId:'p1',status:'todo',priority:'medium',date:iso(new Date(today.getFullYear(),today.getMonth(),today.getDate()+1)),time:'13:00',category:'task',notes:''},{id:uid(),title:'จัดโต๊ะทำงาน 10 นาที',projectId:'p2',status:'done',priority:'low',date:iso(today),time:'18:00',category:'habit',notes:''}],projects:[{id:'p1',name:'พัฒนาภาษาอังกฤษ (B2)',color:'#d8c9ed',status:'progress',start:iso(today),due:iso(new Date(today.getFullYear(),today.getMonth(),today.getDate()+30)),goal:'เรียนต่อเนื่องและมั่นใจขึ้น'},{id:'p2',name:'Gentle Life Reset',color:'#b7c9b2',status:'progress',start:iso(today),due:iso(new Date(today.getFullYear(),today.getMonth(),today.getDate()+14)),goal:'สร้างกิจวัตรที่เหมาะกับตัวเอง'}],goals:[{id:uid(),title:'พัฒนาภาษาอังกฤษระดับ B2',progress:40,due:'',category:'Study'}],subjects:[{id:uid(),name:'Business English',progress:70},{id:uid(),name:'วิชาทั่วไป',progress:35}],habits:[{id:uid(),name:'ดื่มน้ำให้เพียงพอ',checks:{}},{id:uid(),name:'อ่านหนังสือ 20 นาที',checks:{}}],transactions:[],journal:[],reviewNote:''});let D;try{D=JSON.parse(localStorage.getItem('gentle-bloom-v1'))||seed()}catch(e){D=seed()}let page='dashboard',month=new Date(today.getFullYear(),today.getMonth(),1),selected=iso(today),statusFilter='all',projectFilter='all',search='';const save=()=>localStorage.setItem('gentle-bloom-v1',JSON.stringify(D)),fmt=d=>d?new Date(d+'T12:00:00').toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit'}):'ไม่กำหนด',pname=id=>D.projects.find(p=>p.id===id)?.name||'ไม่ระบุโปรเจกต์',slabel=s=>(S.find(x=>x[0]===s)||S[0])[1],stag=s=>`<span class="tag ${s}">${slabel(s)}${s==='done'?' ✓':''}</span>`,cname=c=>(C.find(x=>x[0]===c)||C[0])[1],toast=s=>{let t=document.getElementById('toast');t.textContent=s;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2000)};
function nav(){document.getElementById('sideNav').innerHTML=P.map(x=>`<button class="navbtn ${page===x[0]?'active':''}" data-page="${x[0]}">${x[1]}　${x[2]}</button>`).join('');document.getElementById('mobileNav').innerHTML=P.filter((x,i)=>[0,1,2,3,4,9].includes(i)).map(x=>`<button class="${page===x[0]?'active':''}" data-page="${x[0]}">${x[1]}<br>${x[2]}</button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()})}
function stats(){return `<div class="cards"><div class="stat">🌷<small>งานที่ยังต้องทำ</small><strong>${D.tasks.filter(t=>!['done','cancelled'].includes(t.status)).length}</strong></div><div class="stat">✅<small>งานเสร็จแล้ว</small><strong>${D.tasks.filter(t=>t.status==='done').length}</strong></div><div class="stat">📅<small>รายการวันที่เลือก</small><strong>${D.tasks.filter(t=>t.date===selected&&t.status!=='cancelled').length}</strong></div><div class="stat">🪴<small>โปรเจกต์ที่กำลังทำ</small><strong>${D.projects.filter(p=>p.status==='progress').length}</strong></div></div>`}
function calendar(){let y=month.getFullYear(),m=month.getMonth(),off=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate(),prev=new Date(y,m,0).getDate(),cells=[];for(let i=0;i<42;i++){let v=i-off+1,d=v<1?new Date(y,m-1,prev+v):v>n?new Date(y,m+1,v-n):new Date(y,m,v),out=v<1||v>n,k=iso(d),items=D.tasks.filter(t=>t.date===k&&t.status!=='cancelled');cells.push(`<button class="day ${out?'out':''} ${k===selected?'selected':''} ${k===iso(today)?'today':''}" data-date="${k}"><span class="num">${d.getDate()}</span><div class="dots">${items.slice(0,5).map(t=>`<i class="dot" style="background:${(C.find(c=>c[0]===t.category)||C[0])[2]};${t.status==='done'?'opacity:.35':''}"></i>`).join('')}</div>${items.slice(0,1).map(t=>`<div class="event" style="${t.status==='done'?'opacity:.4;text-decoration:line-through':''}">${esc(t.title)}</div>`).join('')}</button>`)}return `<section class="panel"><div class="calendar-head"><div><h2>🗓️ Master Calendar</h2><small>ปฏิทินเดือน · เลือกวันที่เพื่อดูรายการ</small></div><div class="toolbar"><button id="prev">‹</button><b>${month.toLocaleDateString('th-TH',{month:'long',year:'numeric'})}</b><button id="next">›</button><button id="today">วันนี้</button></div></div><div class="calendar-grid">${['อา','จ','อ','พ','พฤ','ศ','ส'].map(x=>`<div class="weekday">${x}</div>`).join('')}${cells.join('')}</div><div class="meta">${C.map(c=>`<span class="tag"><i class="dot" style="background:${c[2]}"></i> ${c[1]}</span>`).join('')} <span class="tag done">✓ เสร็จแล้ว (สีจาง)</span></div></section>`}
function taskrow(t){return `<div class="rowitem ${t.status==='done'?'doneItem':''}"><input type="checkbox" data-check="${t.id}" ${t.status==='done'?'checked':''}><div class="item-body"><div class="item-title">${esc(t.title)}</div><div class="meta">${stag(t.status)}<span class="tag">${esc(pname(t.projectId))}</span><span class="tag">${fmt(t.date)}</span><span class="tag">${cname(t.category)}</span><span class="tag">${t.priority==='high'?'สำคัญสูง':t.priority==='low'?'ต่ำ':'ปานกลาง'}</span></div></div><button class="ghost smallbtn" data-edit="${t.id}">แก้ไข</button><button class="ghost smallbtn" data-cycle="${t.id}">สถานะ</button></div>`}
function projectcard(p){let ts=D.tasks.filter(t=>t.projectId===p.id),done=ts.filter(t=>t.status==='done').length,pct=ts.length?Math.round(done/ts.length*100):0;return `<div class="project-card"><div class="panel-head"><h3><i class="dot" style="background:${p.color}"></i> ${esc(p.name)}</h3><button class="ghost smallbtn" data-pedit="${p.id}">แก้ไข</button></div><small>${esc(p.goal||'')}</small><div class="meta">${stag(p.status)}<span class="tag">ครบกำหนด ${fmt(p.due)}</span></div><div class="bar"><span style="width:${pct}%"></span></div><small>${pct}% · เสร็จ ${done}/${ts.length} งาน</small><p><button class="smallbtn" data-pfilter="${p.id}">ดูงานในโปรเจกต์</button></p></div>`}
function taskform(id=''){let t=D.tasks.find(x=>x.id===id)||{title:'',projectId:'',status:'todo',priority:'medium',date:selected,time:'',category:'task',notes:''},m=document.createElement('div');m.id='modal';m.style='position:fixed;inset:0;background:#49394766;display:grid;place-items:center;padding:15px;z-index:10';m.innerHTML=`<form class="panel" id="taskform" style="width:min(620px,100%);max-height:92vh;overflow:auto"><div class="panel-head"><h2>${id?'แก้ไขงาน':'เพิ่มงานใหม่'}</h2><button type="button" id="close">ปิด</button></div><div class="formgrid"><div class="field full"><label>ชื่องาน *</label><input name="title" required value="${esc(t.title)}" placeholder="เช่น ส่งรายงาน / อ่านบทเรียน"></div><div class="field"><label>โปรเจกต์</label><select name="projectId"><option value="">ไม่ระบุโปรเจกต์</option>${D.projects.map(p=>`<option value="${p.id}" ${t.projectId===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>สถานะ</label><select name="status">${S.map(s=>`<option value="${s[0]}" ${t.status===s[0]?'selected':''}>${s[1]}</option>`).join('')}</select></div><div class="field"><label>วันครบกำหนด</label><input type="date" name="date" value="${t.date||''}"></div><div class="field"><label>เวลา</label><input type="time" name="time" value="${t.time||''}"></div><div class="field"><label>ประเภท</label><select name="category">${C.map(c=>`<option value="${c[0]}" ${t.category===c[0]?'selected':''}>${c[1]}</option>`).join('')}</select></div><div class="field"><label>ความสำคัญ</label><select name="priority"><option value="high" ${t.priority==='high'?'selected':''}>สูง</option><option value="medium" ${t.priority==='medium'?'selected':''}>ปานกลาง</option><option value="low" ${t.priority==='low'?'selected':''}>ต่ำ</option></select></div><div class="field full"><label>รายละเอียด</label><textarea name="notes">${esc(t.notes)}</textarea></div></div><div class="toolbar" style="justify-content:space-between;margin-top:12px">${id?'<button t

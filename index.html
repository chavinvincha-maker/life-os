home:['ภาพรวมชีวิตของฉัน ♡','A LITTLE STEP TODAY'],planner:['แพลนเนอร์ & งาน','PLAN GENTLY, DO ONE THING'],goals:['เป้าหมาย & โปรเจกต์','SMALL STEPS, BIG DREAMS'],manifest:['Manifestation Garden','INTENTION · ACTION · REFLECTION'],finance:['การเงินของฉัน','MONEY WITH CLARITY'],health:['สุขภาพ & Wellness','CARE FOR YOURSELF'],learning:['การเรียน & อาชีพ','KEEP GROWING'],documents:['เอกสารส่วนตัว','IMPORTANT DATES, LESS WORRY'],homecare:['บ้าน & Lifestyle','A SPACE THAT SUPPORTS YOU'],journal:['Journal & Gratitude','NOTICE THE LITTLE THINGS'],review:['Review & Analytics','REFLECT WITH KINDNESS'],knowledge:['คลังความรู้','SAVE WHAT MATTERS'],settings:['ตั้งค่า & ข้อมูล','YOUR DATA, YOUR CONTROL']};
let currentPage='home', currentType=null, db={};
function load(){try{db=JSON.parse(localStorage.getItem('gentleBloomDB'))||{}}catch(e){db={}};for(const k of Object.keys(schema))if(!Array.isArray(db[k]))db[k]=[];if(!db.settings)db.settings={name:'lovely you'};}

function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtDate(d){if(!d)return '—';try{return new Date(d+'T00:00:00').toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'})}catch(e){return d}}
function toast(msg){const t=$('#toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',2500)}
function total(type){return db[type]||[]}
function activeTasks(){return total('tasks').filter(x=>x.status!=='เสร็จแล้ว'&&!x.done)}
function completedTasks(){return total('tasks').filter(x=>x.status==='เสร็จแล้ว'||x.done)}
function card(title,body,span='span-6'){return `<section class="card ${span}"><div class="card-head"><h3>${title}</h3></div>${body}</section>`}
function empty(msg='ยังไม่มีรายการ ลองเพิ่มรายการแรกของคุณ ♡'){return `<div class="empty">${msg}</div>`}
function miniList(items,metaFn=()=>'',type=null){if(!items.length)return empty();return `<div class="list">${items.slice(0,6).map(x=>`<div class="list-row">${type==='tasks'?`<input type="checkbox" ${x.status==='เสร็จแล้ว'||x.done?'checked':''} data-taskcheck="${x.id}">`:''}<div class="row-main"><div class="row-title">${esc(x.title||'ไม่มีชื่อ')}</div><div class="row-meta">${esc(metaFn(x)||'')}</div></div>${x.status?`<span class="badge">${esc(x.status)}</span>`:''}</div>`).join('')}</div>`}
function metric(icon,label,value,color,foot=''){return `<section class="card span-3"><div class="metric-icon ${color}">${icon}</div><div class="metric">${value}</div><div class="metric-label">${label}</div>${foot?`<div class="sub" style="margin-top:6px">${foot}</div>`:''}</section>`}
function dueItems(){const now=today();let out=[];for(const [type,key,label] of [['bills','due','บิล'],['documents','expiry','เอกสาร'],['appointments','date','นัดหมาย'],['tasks','due','งาน']])for(const x of total(type)){if(x[key]&&x[key]>=now&&x[key]<=new Date(Date.now()+14*86400000).toISOString().slice(0,10)&&x.status!=='ชำระแล้ว'&&x.status!=='เสร็จแล้ว')out.push({...x,_type:type,_label:label,_date:x[key]})}return out.sort((a,b)=>a._date.localeCompare(b._date))}
function homePage(){let due=dueItems(),income=total('transactions').filter(x=>x.kind==='รายรับ').reduce((a,x)=>a+(+x.amount||0),0),expense=total('transactions').filter(x=>x.kind==='รายจ่าย').reduce((a,x)=>a+(+x.amount||0),0);return `<div class="hero"><div><span class="pill">YOUR GENTLE RESET ♡</span><h3>ค่อย ๆ เติบโตในแบบของคุณ 🌷</h3><p>ไม่จำเป็นต้องจัดการทุกอย่างให้สมบูรณ์แบบวันนี้ เลือกหนึ่งสิ่งเล็ก ๆ ที่ช่วยให้ชีวิตพรุ่งนี้ง่ายขึ้นก็พอ</p><div class="quick-actions" style="margin-top:15px"><button class="btn primary" data-add="tasks">＋ เพิ่มงานวันนี้</button><button class="btn soft" data-page="manifest">✨ ตั้งเจตนาวันนี้</button></div></div><div class="hero-art">🌸</div></div><div class="grid">${metric('☑️','งานที่ยังต้องทำ',activeTasks().length,'pink',`${completedTasks().length} งานที่ทำเสร็จแล้ว`)}${metric('🎯','เป้าหมายทั้งหมด',total('goals').length,'lav','ทุกก้าวเล็ก ๆ มีความหมาย')}${metric('🧾','บิลที่รอชำระ',total('bills').filter(x=>x.status!=='ชำระแล้ว').length,'cream','ตรวจสอบวันครบกำหนด')}${metric('📄','เอกสารที่ต้องติดตาม',total('documents').filter(x=>x.expiry&&x.expiry<=new Date(Date.now()+60*86400000).toISOString().slice(0,10)).length,'mint','หมดอายุภายใน 60 วัน')} ${card('♡ งานที่กำลังโฟกัส',miniList(activeTasks(),x=>`${x.due?'กำหนดส่ง '+fmtDate(x.due)+' · ':''}${x.category||'งานทั่วไป'}`,'tasks'),'span-7')}${card('🗓️ สิ่งที่ใกล้ถึงกำหนด',due.length?miniList(due,x=>`${x._label} · ${fmtDate(x._date)}`):empty('ยังไม่มีรายการใกล้ถึงกำหนด ดีเลย ♡'),'span-5')}${card('💰 ภาพรวมการเงิน',`<div class="grid" style="gap:8px"><div class="span-6" style="background:#eff8f1;border-radius:12px;padding:12px"><div class="sub">รายรับที่บันทึกไว้</div><strong>${money(income)}</strong></div><div class="span-6" style="background:#fff0f3;border-radius:12px;padding:12px"><div class="sub">รายจ่ายที่บันทึกไว้</div><strong>${money(expense)}</strong></div></div><p class="sub">ยอดรวมจากรายการที่คุณบันทึก ไม่ใช่ยอดบัญชีธนาคารแบบเรียลไทม์</p><button class="btn soft" data-page="finance">ไปหน้าการเงิน →</button>`,'span-6')}${card('✨ Manifestation of the day',`<div class="dream-card"><span class="pill">A KIND REMINDER</span><blockquote>“ฉันไม่จำเป็นต้องสมบูรณ์แบบ ฉันเพียงต้องเรียนรู้และลงมือทำอย่างสม่ำเสมอ”</blockquote></div><p class="sub">วันนี้เลือกการกระทำหนึ่งอย่างที่สอดคล้องกับชีวิตที่อยากสร้าง</p><button class="btn soft" data-page="manifest">เปิด Manifestation Garden →</button>`,'span-6')}</div>`}
function taskPage(){return `<div class="toolbar"><input class="search" id="searchInput" placeholder="ค้นหางาน..."><select class="search" id="filterStatus"><option value="">ทุกสถานะ</option><option>ยังไม่เริ่ม</option><option>กำลังทำ</option><option>เสร็จแล้ว</option></select><button class="btn primary" data-add="tasks">＋ เพิ่มงาน</button><button class="btn soft" data-add="habits">＋ เพิ่มนิสัย</button></div><div class="grid">${card('☑️ งานทั้งหมด',renderTable('tasks'),'span-12')}${card('🌱 นิสัยที่กำลังฝึก',miniList(total('habits'),x=>x.frequency+' · '+x.status),'span-6')}${card('📁 โปรเจกต์',miniList(total('projects'),x=>x.target?'กำหนดเสร็จ '+fmtDate(x.target):x.status),'span-6')}</div>`}
function renderTable(type,filter=''){let items=total(type).filter(x=>JSON.stringify(x).toLowerCase().includes(filter.toLowerCase()));if(type==='tasks'&&$('#filterStatus')?.value)items=items.filter(x=>x.status===$('#filterStatus').value);if(!items.length)return empty();let cols=type==='tasks'?['title','due','priority','status']:type==='goals'?['title','area','target','status']:type==='transactions'?['title','kind','amount','date','category']:type==='bills'?['title','amount','due','status']:type==='documents'?['title','kind','expiry','status']:type==='appointments'?['title','date','time','kind']:type==='medications'?['title','dose','schedule','end']:type==='savings'?['title','targetAmount','savedAmount','target']:type==='debts'?['title','amount','payment','due']:['title','date','status','notes'];return `<div class="table-wrap"><table class="table"><thead><tr>${cols.map(c=>`<th>${({title:'รายการ',due:'กำหนดส่ง',priority:'ความสำคัญ',status:'สถานะ',area:'ด้านชีวิต',target:'เป้าหมาย/วันที่',kind:'ประเภท',amount:'จำนวนเงิน',date:'วันที่',category:'หมวดหมู่',expiry:'วันหมดอายุ',time:'เวลา',dose:'ขนาด/วิธีใช้',schedule:'ความถี่',end:'วันสิ้นสุด',targetAmount:'เงินเป้าหมาย',savedAmount:'ออมแล้ว',payment:'จ่ายต่อเดือน',notes:'หมายเหตุ'}[c]||c)}</th>`).join('')}<th>จัดการ</th></tr></thead><tbody>${items.map(x=>`<tr>${cols.map(c=>`<td>${c==='amount'||c==='targetAmount'||c==='savedAmount'||c==='payment'?money(x[c]):c==='due'||c==='date'||c==='target'||c==='expiry'||c==='end'?fmtDate(x[c]):esc(x[c]||'—')}</td>`).join('')}<td><button data-edit="${type}:${x.id}">แก้ไข</button> · <button class="danger" data-delete="${type}:${x.id}">ลบ</button></td></tr>`).join('')}</tbody></table></div>`}
function goalsPage(){return `<div class="toolbar"><button class="btn primary" data-add="goals">＋ เพิ่มเป้าหมาย</button><button class="btn soft" data-add="projects">＋ เพิ่มโปรเจกต์</button></div><div class="grid">${card('🎯 Goals',miniList(total('goals'),x=>(x.area||'')+' · '+(x.target?fmtDate(x.target):'ไม่กำหนด')+' · '+(x.status||'')),'span-6')}${card('📁 Projects',miniList(total('projects'),x=>(x.target?fmtDate(x.target):'')+' · '+(x.status||'')),'span-6')}${card('ก้าวถัดไปของเป้าหมาย',total('goals').length?`<div class="list">${total('goals').map(x=>`<div class="list-row"><div class="row-main"><div class="row-title">${esc(x.title)}</div><div class="row-meta">${esc(x.next||'เพิ่มก้าวถัดไปเพื่อเริ่มลงมือทำ')}</div></div><button class="small-btn" data-edit="goals:${x.id}">แก้ไข</button></div>`).join('')}</div>`:empty(),'span-12')}</div>`}
function manifestPage(){return `<div class="hero"><div><span class="pill">DREAM · BELIEVE · BECOME · ACT</span><h3>Manifestation Garden ✨</h3><p>ความตั้งใจช่วยให้เราเห็นทิศทาง ส่วนการลงมือทำช่วยพาเราไปใกล้เป้าหมาย บันทึกทั้งความฝันและก้าวเล็ก ๆ ที่ทำได้จริง</p></div><div class="hero-art">🦋</div></div><div class="grid">${card('🌸 My Dream Life',`<div class="dream-card"><h3>ฉันกำลังเติบโตเป็นตัวเองในเวอร์ชันที่ดีที่สุด</h3><p class="sub">ฉันไม่ต้องเปลี่ยนทุกอย่างในวันเดียว ฉันเลือกก้าวที่เป็นไปได้ในวันนี้</p></div><div class="quick-actions" style="margin-top:12px"><button class="btn primary" data-add="manifestations">＋ เพิ่มความฝัน</button><button class="btn soft" data-add="affirmations">＋ เพิ่ม Affirmation</button></div>`,'span-12')}${card('✨ Manifestation Goals',miniList(total('manifestations'),x=>(x.area||'')+' · '+(x.status||'')+' · '+(x.target?fmtDate(x.target):'')),'span-6')}${card('💗 Affirmation Library',miniList(total('affirmations'),x=>x.category||'ประโยคเตือนใจ'),'span-6')}${card('🌷 Daily Gratitude',`<button class="btn primary" data-add="gratitude">＋ บันทึกสิ่งที่ขอบคุณ</button><div style="margin-top:12px">${miniList(total('gratitude'),x=>(x.date?fmtDate(x.date):'')+' · '+(x.mood||''))}</div>`,'span-6')}${card('🌱 Aligned Actions',`<p class="sub">เลือกการกระทำที่เล็กพอจะเริ่มได้วันนี้ แล้วบันทึกเป็นงานเพื่อให้ติดตามได้</p><button class="btn soft" data-add="tasks">＋ เพิ่มก้าวเล็ก ๆ เป็นงาน</button><div style="margin-top:12px">${miniList(activeTasks(),x=>x.due?fmtDate(x.due):'ยังไม่กำหนด','tasks')}</div>`,'span-6')}</div>`}
function financePage(){let tx=total('transactions'),inc=tx.filter(x=>x.kind==='รายรับ').reduce((a,x)=>a+(+x.amount||0),0),exp=tx.filter(x=>x.kind==='รายจ่าย').reduce((a,x)=>a+(+x.amount||0),0),debt=total('debts').reduce((a,x)=>a+(+x.amount||0),0),saved=total('savings').reduce((a,x)=>a+(+x.savedAmount||0),0);return `<div class="grid">${metric('🌱','รายรับที่บันทึก',money(inc),'mint')}${metric('🛍️','รายจ่ายที่บันทึก',money(exp),'pink')}${metric('💳','หนี้คงเหลือที่บันทึก',money(debt),'cream')}${metric('🐷','เงินออมที่บันทึก',money(saved),'lav')}${card('💸 รายรับ / รายจ่าย',`<div class="toolbar"><button class="btn primary" data-add="transactions">＋ เพิ่มธุรกรรม</button><button class="btn soft" data-add="bills">＋ เพิ่มบิล</button></div>${renderTable('transactions')}`,'span-12')}${card('🧾 บิล & การชำระ',`<div class="toolbar"><button class="btn primary" data-add="bills">＋ เพิ่มบิล</button></div>${renderTable('bills')}`,'span-6')}${card('💳 หนี้สิน',`<div class="toolbar"><button class="btn primary" data-add="debts">＋ เพิ่มหนี้</button></div>${renderTable('debts')}`,'span-6')}${card('🐷 เงินออม',`<div class="toolbar"><button class="btn primary" data-add="savings">＋ เพิ่มเป้าหมายออม</button></div>${renderTable('savings')}`,'span-12')}<div class="span-12 notice">หมายเหตุ: กรอกเฉพาะข้อมูลที่จำเป็น ยอดรวมคำนวณจากรายการที่คุณบันทึก ไม่ได้เชื่อมต่อธนาคารหรือยืนยันยอดเงินจริงโดยอัตโนมัติ</div></div>`}
function healthPage(){return `<div class="grid">${card('💊 ยาและวิตามิน',`<div class="toolbar"><button class="btn primary" data-add="medications">＋ เพิ่มรายการยา</button></div>${renderTable('medications')}`,'span-12')}${card('🗓️ นัดหมายสุขภาพ',`<div class="toolbar"><button class="btn primary" data-add="appointments">＋ เพิ่มนัดหมาย</button></div>${renderTable('appointments')}`,'span-12')}${card('🌿 บันทึกสุขภาพ',`<div class="toolbar"><button class="btn primary" data-add="health">＋ เพิ่มบันทึก</button></div>${miniList(total('health'),x=>(x.date?fmtDate(x.date):'')+' · '+(x.kind||''))}`,'span-12')}<div class="span-12 notice">บันทึกนี้ใช้ช่วยจัดระเบียบข้อมูลเท่านั้น ไม่ใช่คำแนะนำทางการแพทย์ โปรดใช้ยาและปรับการรักษาตามคำแนะนำของแพทย์หรือเภสัชกร</div></div>`}
function learningPage(){return `<div class="grid">${card('📚 คอร์สและทักษะ',`<div class="toolbar"><button class="btn primary" data-add="learning">＋ เพิ่มคอร์ส / ทักษะ</button></div>${renderTable('learning')}`,'span-12')}${card('🎯 เป้าหมายการเรียน',miniList(total('goals').filter(x=>['การเรียน','อาชีพ'].includes(x.area)),x=>(x.area||'')+' · '+(x.status||'')),'span-6')}${card('☑️ งานเรียนที่ต้องทำ',miniList(total('tasks').filter(x=>x.category==='การเรียน'&&x.status!=='เสร็จแล้ว'),x=>x.due?fmtDate(x.due):'ยังไม่กำหนด','tasks'),'span-6')}</div>`}
function docsPage(){let docs=total('documents').slice().sort((a,b)=>(a.expiry||'9999').localeCompare(b.expiry||'9999'));return `<div class="grid">${metric('🪪','เอกสารทั้งหมด',docs.length,'lav')}${metric('⚠️','หมดอายุใน 30 วัน',docs.filter(x=>x.expiry&&x.expiry>=today()&&x.expiry<=new Date(Date.now()+30*86400000).toISOString().slice(0,10)).length,'cream')}${metric('📌','หมดอายุแล้ว',docs.filter(x=>x.expiry&&x.expiry<today()).length,'pink')}${metric('🔄','รอต่ออายุ',docs.filter(x=>x.status==='รอต่ออายุ').length,'mint')}${card('📂 รายการเอกสาร',`<div class="toolbar"><button class="btn primary" data-add="documents">＋ เพิ่มเอกสาร</button></div>${renderTable('documents')}`,'span-12')}<div class="span-12 notice">เพื่อความปลอดภัย ไม่ควรบันทึกเลขบัตรประชาชน เลขหนังสือเดินทาง รหัสผ่าน หรือภาพเอกสารอ่อนไหวลงในเว็บตัวอย่างนี้ เก็บเฉพาะชื่อ วันหมดอายุ และตำแหน่งจัดเก็บที่ปลอดภัย</div></div>`}
function homecarePage(){return `<div class="grid">${card('🏡 งานบ้านและ Lifestyle',`<div class="toolbar"><button class="btn primary" data-add="homecare">＋ เพิ่มรายการ</button></div>${renderTable('homecare')}`,'span-12')}${card('🌱 นิสัยและกิจวัตร',`<div class="toolbar"><button class="btn primary" data-add="habits">＋ เพิ่มนิสัย</button></div>${miniList(total('habits'),x=>(x.frequency||'')+' · '+(x.status||''))}`,'span-6')}${card('🧺 งานบ้านที่ยังต้องทำ',miniList(total('homecare').filter(x=>x.status!=='เสร็จแล้ว'),x=>(x.kind||'')+' · '+(x.due?fmtDate(x.due):'')),'span-6')}</div>`}
function journalPage(){return `<div class="grid">${card('📔 บันทึกประจำวัน',`<div class="toolbar"><button class="btn primary" data-add="journal">＋ เขียน Journal</button><button class="btn soft" data-add="gratitude">＋ Gratitude</button></div>${miniList(total('journal').slice().reverse(),x=>(x.date?fmtDate(x.date):'')+' · '+(x.mood||''))}`,'span-6')}${card('🌷 Gratitude Journal',`<div class="toolbar"><button class="btn primary" data-add="gratitude">＋ บันทึกความขอบคุณ</button></div>${miniList(total('gratitude').slice().reverse(),x=>(x.date?fmtDate(x.date):'')+' · '+(x.mood||''))}`,'span-6')}${card('💗 Affirmations',miniList(total('affirmations'),x=>x.category||''),'span-12')}</div>`}
function reviewPage(){let all=Object.values(db).filter(Array.isArray).flat().length,done=completedTasks().length,tasks=total('tasks').length,pct=tasks?Math.round(done/tasks*100):0;return `<div class="grid">${metric('🌱','รายการทั้งหมด',all,'mint','รายการที่คุณบันทึกในระบบ')}${metric('☑️','งานเสร็จแล้ว',done,'pink','จากงานทั้งหมด '+tasks+' รายการ')}${metric('🎯','เป้าหมาย',total('goals').length,'lav','สิ่งที่กำลังสร้าง')}${metric('📔','บันทึกสะท้อนตัวเอง',total('journal').length+total('gratitude').length,'cream','Journal + Gratitude')}${card('📈 ความคืบหน้างาน',`<div class="metric">${pct}%</div><div class="progress"><span style="width:${pct}%"></span></div><p class="sub">นับงานที่มีสถานะเสร็จแล้วเทียบกับงานทั้งหมด ปรับสถานะได้จากหน้าแพลนเนอร์</p>`,'span-6')}${card('🌸 Weekly reflection',`<p>• สัปดาห์นี้อะไรทำให้ฉันภูมิใจ?</p><p>• อะไรใช้พลังงานมากกว่าที่คิด?</p><p>• ฉันอยากทำอะไรให้ง่ายขึ้นในสัปดาห์หน้า?</p><button class="btn primary" data-add="journal">＋ เขียน Reflection</button>`,'span-6')}${card('📊 ข้อมูลที่บันทึกแยกตามหมวด',`<div class="list">${Object.entries(schema).map(([k,v])=>`<div class="list-row"><div class="row-main"><div class="row-title">${v.icon} ${v.label}</div></div><span class="badge">${total(k).length} รายการ</span></div>`).join('')}</div>`,'span-12')}</div>`}
function knowledgePage(){return `<div class="grid">${card('🗂️ คลังความรู้',`<div class="toolbar"><button class="btn primary" data-add="knowledge">＋ เพิ่มโน้ต</button></div>${miniList(total('knowledge').slice().reverse(),x=>x.kind||'')}`,'span-12')}</div>`}
function settingsPage(){return `<div class="grid">${card('👤 การตั้งค่าส่วนตัว',`<div class="field"><label>ชื่อที่อยากให้แสดง</label><input id="displayName" value="${esc(db.settings.name||'lovely you')}"></div><button class="btn primary" id="saveSettings">บันทึกการตั้งค่า</button>`,'span-6')}${card('💾 สำรองและกู้คืนข้อมูล',`<p class="sub">ข้อมูลจะถูกเก็บไว้ใน Local Storage ของเบราว์เซอร์นี้ การส่งออก JSON ช่วยสำรองหรือย้ายข้อมูลไปเครื่องอื่น</p><div class="quick-actions"><button class="btn primary" id="exportBtn">↓ ส่งออก JSON</button><button class="btn soft" id="importBtn">↑ นำเข้า JSON</button></div><p class="sub">นำเข้าข้อมูลจะแทนที่ข้อมูลเดิมทั้งหมด โปรดส่งออกข้อมูลสำรองก่อนนำเข้า</p>`,'span-6')}${card('🛡️ ความเป็นส่วนตัวและข้อจำกัด',`<ul class="sub" style="padding-left:18px;line-height:2"><li>ข้อมูลอยู่ในเบราว์เซอร์เครื่องนี้ ไม่ได้ซิงก์ข้ามอุปกรณ์</li><li>ผู้ใช้เครื่องเดียวกันอาจเข้าถึงข้อมูลได้ ควรล็อกอุปกรณ์</li><li>ยังไม่มีระบบบัญชีผู้ใช้หรือการเข้ารหัสข้อมูลในแอป</li><li>อย่าบันทึกรหัสผ่านหรือข้อมูลระบุตัวตนที่ละเอียดอ่อน</li><li>เว็บตัวอย่างนี้ไม่เชื่อมธนาคาร ปฏิทิน หรือบริการแจ้งเตือนภายนอก</li></ul>`,'span-12')}${card('🧹 จัดการข้อมูล',`<button class="btn ghost" id="clearDone">ล้างเฉพาะงานที่เสร็จแล้ว</button> <button class="btn ghost danger" id="clearAll">ลบข้อมูลทั้งหมด</button>`,'span-12')}</div>`}
const renderers={home:homePage,planner:taskPage,goals:goalsPage,manifest:manifestPage,finance:financePage,health:healthPage,learning:learningPage,documents:docsPage,homecare:homecarePage,journal:journalPage,review:reviewPage,knowledge:knowledgePage,settings:settingsPage};
function render(){const [title,eyebrow]=pages[currentPage];$('#pageTitle').textContent=title;$('#eyebrow').textContent=eyebrow;$('#content').innerHTML=renderers[currentPage]();document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===currentPage));$('#sidebar').classList.remove('open');}
function openModal(type,id=null){currentType=type;const s=schema[type];if(!s)return;const existing=id?total(type).find(x=>x.id===id):null;$('#modalTitle').textContent=(existing?'แก้ไข':'เพิ่ม')+s.label;$('#formFields').innerHTML=`<div class="form-grid">${s.fields.map(([key,label,kind,opts])=>{let input='';const val=existing?.[key]??(key==='date'?today():'');if(kind==='select'){input=`<select name="${key}"><option value="">เลือก...</option>${String(opts).split('|').map(o=>`<option ${val===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`}else if(kind==='textarea'){input=`<textarea name="${key}" placeholder="เขียนได้ตามสบาย...">${esc(val)}</textarea>`}else{input=`<input name="${key}" type="${kind}" value="${esc(val)}" ${opts===true?'required':''} ${kind==='number'?'min="0" step="0.01"':''}>`}return `<div class="field ${kind==='textarea'?'full':''}"><label>${esc(label)}${opts===true&&kind!=='select'?' *':''}</label>${input}</div>`}).join('')}</div><input type="hidden" name="__id" value="${existing?.id||''}">`;$('#modalBackdrop').classList.add('open');}
function closeModal(){$('#modalBackdrop').classList.remove('open');currentType=null;}
function submitForm(e){e.preventDefault();const form=new FormData(e.target),id=form.get('__id');let obj={};for(const [k,v] of form.entries())if(k!=='__id')obj[k]=v;obj.id=id||uid();if(currentType==='tasks'&&!obj.status)obj.status='ยังไม่เริ่ม';if(currentType==='bills'&&!obj.status)obj.status='รอชำระ';const arr=total(currentType),idx=arr.findIndex(x=>x.id===obj.id);if(idx>=0)arr[idx]={...arr[idx],...obj};else arr.unshift(obj);save();closeModal();render();toast('บันทึกเรียบร้อยแล้ว ♡');}
function exportData(){const blob=new Blob([JSON.stringify({app:'Life OS – Gentle Bloom',version:1,exportedAt:new Date().toISOString(),data:db},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='gentle-bloom-backup-'+today()+'.json';a.click();URL.revokeObjectURL(a.href);toast('เตรียมไฟล์สำรองแล้ว ♡');}
function importData(file){const r=new FileReader();r.onload=()=>{try{const parsed=JSON.parse(r.result);const incoming=parsed.data||parsed;if(!confirm('การนำเข้าจะแทนที่ข้อมูลปัจจุบันทั้งหมด ต้องการดำเนินการต่อหรือไม่?'))return;db=incoming;for(const k of Object.keys(schema))if(!Array.isArray(db[k]))db[k]=[];if(!db.settings)db.settings={name:'lovely you'};save();render();toast('นำเข้าข้อมูลสำเร็จ ♡')}catch(e){alert('ไฟล์ไม่ถูกต้อง กรุณาเลือกไฟล์ JSON สำรองของ Gentle Bloom')}};r.readAsText(file);}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-page]');if(nav){currentPage=nav.dataset.page;render();return}const add=e.target.closest('[data-add]');if(add){openModal(add.dataset.add);return}const edit=e.target.closest('[data-edit]');if(edit){const [type,id]=edit.dataset.edit.split(':');openModal(type,id);return}const del=e.target.closest('[data-delete]');if(del){const [type,id]=del.dataset.delete.split(':');if(confirm('ต้องการลบรายการนี้หรือไม่?')){db[type]=total(type).filter(x=>x.id!==id);save();render();toast('ลบรายการแล้ว')}return}const check=e.target.closest('[data-taskcheck]');if(check){const t=total('tasks').find(x=>x.id===check.dataset.taskcheck);if(t){t.status=check.checked?'เสร็จแล้ว':'ยังไม่เริ่ม';t.done=check.checked;save();render()}return}if(e.target.id==='quickAdd'){openModal('tasks')}if(e.target.id==='exportTop'||e.target.id==='exportBtn')exportData();if(e.target.id==='importBtn')$('#importFile').click();if(e.target.id==='mobileMenu')$('#sidebar').classList.toggle('open');if(e.target.id==='saveSettings'){db.settings.name=$('#displayName').value.trim()||'lovely you';save();toast('บันทึกการตั้งค่าแล้ว')}if(e.target.id==='clearDone'){if(confirm('ลบงานที่เสร็จแล้วทั้งหมด?')){db.tasks=total('tasks').filter(x=>x.status!=='เสร็จแล้ว'&&!x.done);save();render();toast('ล้างงานที่เสร็จแล้วแล้ว')}}if(e.target.id==='clearAll'){if(confirm('คำเตือน: การกระทำนี้ลบข้อมูลทุกหมวดจากเบราว์เซอร์นี้และย้อนกลับไม่ได้ หากยังไม่ได้สำรองข้อมูลควรกดยกเลิก ต้องการลบหรือไม่?')){for(const k of Object.keys(schema))db[k]=[];save();render();toast('ลบข้อมูลแล้ว')}}});
$('#entryForm').addEventListener('submit',submitForm);$('#modalClose').onclick=closeModal;$('#cancelModal').onclick=closeModal;$('#modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal()});$('#exportTop').onclick=exportData;$('#importFile').addEventListener('change',e=>{if(e.target.files[0])importData(e.target.files[0]);e.target.value=''});$('#content').addEventListener('input',e=>{if(e.target.id==='searchInput'){const t=$('#content').querySelector('.table-wrap');if(t){const old=$('#content').querySelector('.card h3');render();const search=$('#searchInput');if(search){search.value=e.target.value;const wrap=$('#content').querySelector('.table-wrap');if(wrap){const card=wrap.closest('.card');const type=currentPage==='planner'?'tasks':currentPage==='finance'?'transactions':currentPage==='documents'?'documents':currentPage==='health'?'medications':currentPage==='learning'?'learning':'tasks';wrap.innerHTML=renderTable(type,search.value)}}}}if(e.target.id==='filterStatus'){const search=$('#searchInput')?.value||'';render();const input=$('#searchInput');if(input)input.value=search;const wrap=$('#content').querySelector('.table-wrap');if(wrap)wrap.innerHTML=renderTable('tasks',search)}}); 
load();render();
</script>
</body>
</html>
